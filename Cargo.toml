[workspace]
resolver = "2"
members = ["crates/eurostat", "crates/eurostat-cli", "crates/eurostat-bench"]
default-members = ["crates/eurostat-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ckirua"]
repository = "https://github.com/ckirua/eurostat"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
arrow = { version = "54", default-features = false, features = ["csv", "json"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
criterion = { version = "0.5", features = ["html_reports"] }
csv = "1.3"
directories = "6.0"
flate2 = "1.0"
futures = "0.3"
fuzzy-matcher = "0.3"
indicatif = "0.17"
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }
polars = { version = "0.46", default-features = false, features = ["lazy", "parquet", "csv", "json"] }
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
wiremock = "0.6"
rust-s3 = { version = "0.35", default-features = false, features = ["with-tokio", "tokio-rustls-tls"] }
clickhouse = { version = "0.13", features = ["time", "inserter", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytes = "1.10"

# Dev: prioritize compile speed over runtime speed.
[profile.dev]
incremental = true
codegen-units = 256

# Heavy deps: light optimization so dev builds feel snappier without release compile cost.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
